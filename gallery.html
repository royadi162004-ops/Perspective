<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gallery | Perspective</title>

    <meta name="description"
          content="Explore the photography collection of Perspective.">

    <link rel="stylesheet" href="style.css">
</head>


<body>

<!-- NAVIGATION -->

<header class="navbar">

    <div class="logo">
        Perspective
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#categories">
            Categories
        </a>

        <a href="index.html#featured">
            Featured
        </a>

        <a href="index.html#stories">
            Stories
        </a>

        <a href="index.html#about">
            About
        </a>

    </nav>

</header>



<!-- GALLERY HEADER -->

<main>

    <section class="gallery-header">

        <a href="index.html#categories"
           class="back-button">

            ← Back to Categories

        </a>


        <p class="section-label">
            EXPLORE THE COLLECTION
        </p>


        <h1 id="gallery-title">
            Photography
        </h1>


        <p id="gallery-description">
            A collection of moments seen from a different perspective.
        </p>

    </section>



    <!-- PHOTO GRID -->

    <section
        id="gallery"
        class="gallery-grid">

        <!-- JavaScript will add photographs here -->

    </section>

</main>



<!-- LIGHTBOX -->

<div id="lightbox"
     class="lightbox">

    <button
        class="lightbox-close"
        onclick="closeLightbox()">

        ×

    </button>


    <img
        id="lightbox-image"
        src=""
        alt="Selected photograph">

</div>



<!-- FOOTER -->

<footer>

    <div class="footer-logo">
        Perspective
    </div>

    <p>
        Different eyes. Different stories. One Perspective.
    </p>

    <p class="copyright">
        © 2026 Perspective. All rights reserved.
    </p>

</footer>



<!-- JAVASCRIPT -->

<script src="script.js"></script>

</body>

</html>
